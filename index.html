    <!-- Pre-script patch to ensure window.fetch is writable and doesn't throw if assigned by environment/extensions -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var _nativeFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _nativeFetch;
              },
              set: function(val) {
                _nativeFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // ignore if already configurable
        }
      })();
    </script>
